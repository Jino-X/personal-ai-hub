[project]
name = "hub-companion"
version = "0.1.0"
description = "Local AI companion for Personal AI Hub — securely bridges the cloud API to Ollama on your Mac."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28.1",
  "websockets>=17.0",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
]

[project.scripts]
hub-companion = "hub_companion.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_companion"]

[tool.uv]
dev-dependencies = ["ruff>=0.14"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]
